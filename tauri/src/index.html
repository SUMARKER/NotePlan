<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' vault: data: https: http:; font-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://raw.githubusercontent.com" />
  <title>NotePlan for Windows</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <!-- ===================== 侧边栏 ===================== -->
    <aside id="sidebar">
      <div class="sb-top">
        <div class="brand">
          <span class="brand-logo">N</span>
          <span class="brand-name">NotePlan</span>
        </div>
        <button id="btn-palette" class="palette-btn" title="命令面板 / 快速打开 (Ctrl+K)">
          <svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M11.74 10.34a1 1 0 0 0-1.4 0 1 1 0 0 0 0 1.4l2.46 2.46a1 1 0 0 0 1.4-1.4zM6.5 11a4.5 4.5 0 1 1 4.5-4.5 4.5 4.5 0 0 1-4.5 4.5m0-11a6.5 6.5 0 1 0 6.5 6.5A6.5 6.5 0 0 0 6.5 0"/></svg>
          <span>快速打开</span>
          <kbd>Ctrl K</kbd>
        </button>
      </div>

      <div class="sb-tabs">
        <button class="sb-tab active" data-tab="calendar">
          <svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M4 0a1 1 0 0 1 1 1v1h6V1a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h1V1a1 1 0 0 1 1-1m0 4H2v2h12V4H4zM2 8v6h12V8z"/></svg>
          每日笔记
        </button>
        <button class="sb-tab" data-tab="notes">
          <svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M3 1.5A1.5 1.5 0 0 1 4.5 0h7A1.5 1.5 0 0 1 13 1.5v13a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 14.5zM4.5 1a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5v-13a.5.5 0 0 0-.5-.5zM6 4h4a.5.5 0 0 1 0 1H6a.5.5 0 0 1 0-1m0 3h4a.5.5 0 0 1 0 1H6a.5.5 0 0 1 0-1m0 3h2.5a.5.5 0 0 1 0 1H6a.5.5 0 0 1 0-1"/></svg>
          笔记
        </button>
      </div>

      <!-- 每日笔记视图 -->
      <div id="sb-calendar" class="sb-view">
        <div class="cal-head">
          <button id="cal-prev" class="icon-btn" title="上个月">‹</button>
          <span id="cal-title">—</span>
          <button id="cal-next" class="icon-btn" title="下个月">›</button>
          <button id="cal-today" class="mini-btn" title="回到本月">今天</button>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
        <div class="sb-section-title">本月笔记</div>
        <div id="daily-list" class="daily-list"></div>
      </div>

      <!-- 笔记视图 -->
      <div id="sb-notes" class="sb-view" hidden>
        <div class="notes-tools">
          <button id="btn-new-note" class="mini-btn primary">＋ 新建笔记</button>
          <button id="btn-new-folder" class="mini-btn">＋ 文件夹</button>
        </div>
        <div id="note-tree" class="note-tree"></div>
        <div class="sb-section-title">标签</div>
        <div id="tag-cloud" class="tag-cloud"></div>
      </div>

      <div class="sb-foot">
        <button id="btn-trash" class="foot-btn" title="已删除的笔记可在此恢复">
          <svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M9 2a1 1 0 0 1 1 1v1h3.5a.5.5 0 0 1 0 1h-11a.5.5 0 0 1 0-1H6V3a1 1 0 0 1 1-1zm2.5 4-0.43 8.15A2 2 0 0 1 9.07 16H6.93a2 2 0 0 1-2-1.85L4.5 6zm-3.65 2a.5.5 0 0 0-.5.5v5a.5.5 0 0 0 1 0v-5a.5.5 0 0 0-.5-.5m2 0a.5.5 0 0 0-.5.5v5a.5.5 0 0 0 1 0v-5a.5.5 0 0 0-.5-.5"/></svg>
          <span>回收站</span>
        </button>
        <button id="btn-vault-folder" class="foot-btn" title="打开笔记库文件夹">
          <svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M1.5 2A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 14.5 4H8.2L6.6 2.4A1.5 1.5 0 0 0 5.5 2zm0 1h4l1.36 1.36.64.64H14.5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5"/></svg>
          <span id="vault-name">笔记库</span>
        </button>
      </div>
    </aside>

    <!-- ===================== 编辑区 ===================== -->
    <main id="main">
      <header id="editor-header">
        <div id="crumb">—</div>
        <div class="header-actions">
          <div class="seg" id="main-seg" title="主视图">
            <button data-main="notes" class="active">笔记</button>
            <button data-main="week">周计划</button>
            <button data-main="month">月历</button>
            <button data-main="year">年</button>
          </div>
          <div class="seg" id="view-seg">
            <button data-view="edit" title="纯编辑 (Ctrl+E 循环切换)">编辑</button>
            <button data-view="split" class="active" title="分栏：左边编辑，右边预览">分栏</button>
            <button data-view="preview" title="纯预览">预览</button>
          </div>
          <button id="btn-theme" class="icon-btn" title="切换深色 / 浅色主题 (Ctrl+Shift+L)">
            <svg class="icon-moon" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M6.2 1a7.3 7.3 0 1 0 8.6 8.6A6 6 0 0 1 6.2 1"/></svg>
            <svg class="icon-sun" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 4.5A3.5 3.5 0 1 0 8 11.5 3.5 3.5 0 0 0 8 4.5M8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0m0 12.5a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 12.5m8-4.5a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8M2.25 8a.75.75 0 0 1-.75.75H0a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 2.25 8m11.42-5.67a.75.75 0 0 1 0 1.06l-1.06 1.06a.75.75 0 0 1-1.06-1.06l1.06-1.06a.75.75 0 0 1 1.06 0M4.45 11.55a.75.75 0 0 1 0 1.06L3.39 13.67a.75.75 0 0 1-1.06-1.06l1.06-1.06a.75.75 0 0 1 1.06 0m9.22 3.18a.75.75 0 0 1-1.06 0l-1.06-1.06a.75.75 0 0 1 1.06-1.06l1.06 1.06a.75.75 0 0 1 0 1.06M4.45 4.45a.75.75 0 0 1-1.06 0L2.33 3.39a.75.75 0 0 1 1.06-1.06l1.06 1.06a.75.75 0 0 1 0 1.06"/></svg>
          </button>
        </div>
      </header>

      <div id="weekbar">
        <button id="wb-prev" class="icon-btn" title="上一周">‹</button>
        <div id="wb-days"></div>
        <button id="wb-next" class="icon-btn" title="下一周">›</button>
        <button id="wb-today" class="mini-btn" title="回到本周">本周</button>
      </div>

      <!-- 月历 / 年视图 -->
      <div id="calview" hidden>
        <div id="calv-head">
          <button id="calv-prev" class="icon-btn">‹</button>
          <span id="calv-title">—</span>
          <button id="calv-next" class="icon-btn">›</button>
          <button id="calv-today" class="mini-btn">今天</button>
          <div class="seg" id="calv-seg">
            <button data-cal="month" class="active">月</button>
            <button data-cal="year">年</button>
          </div>
          <span id="calv-legend">
            <span class="lg-dot lg-task"></span>任务时间块
            <span class="lg-dot lg-event"></span>日历事件
            <span class="lg-dot lg-note"></span>有笔记
            <span class="lg-hol">休</span>法定节假日
          </span>
        </div>
        <div id="calv-body">
          <div id="calv-main"></div>
          <div id="calv-side">
            <div class="tl-title" id="tl-title">—</div>
            <div id="tl-allday"></div>
            <div id="tl-grid-wrap">
              <div id="tl-grid"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 周计划 -->
      <div id="weekplan" hidden>
        <div id="wp-head">
          <button id="wp-prev" class="icon-btn" title="上一周">‹</button>
          <span id="wp-title">—</span>
          <button id="wp-next" class="icon-btn" title="下一周">›</button>
          <button id="wp-today" class="mini-btn" title="回到本周">本周</button>
          <span id="wp-stats"></span>
        </div>
        <div id="wp-goal-card">
          <div class="wp-goal-head">
            <span class="wp-goal-title">🎯 本周目标</span>
            <span class="wp-goal-hint">回车添加 · 双击文字编辑 · ☑ 勾选完成 · 📅 排期汇入日列</span>
          </div>
          <div id="wp-goal-list"></div>
          <div class="wp-goal-add">
            <button id="wp-goal-kind" class="wp-kind-toggle" title="当前：待办（点击切换为普通内容）">☑</button>
            <input id="wp-goal-input" type="text" placeholder="＋ 添加目标待办，回车" autocomplete="off">
          </div>
        </div>
        <div id="wp-grid"></div>
      </div>

      <div id="editor-wrap">
        <textarea id="editor" spellcheck="false"
          placeholder="开始书写……&#10;&#10;支持 Markdown 语法：&#10;- [ ] 任务清单&#10;[[双链]] · #标签 · >2026-09-01 安排日期&#10;==高亮== · **加粗** · *斜体* · `代码`"></textarea>
        <div id="cm-host" hidden></div>
        <div id="preview" class="markdown-body" hidden></div>
        <div id="ext-banner" class="ext-banner" hidden>
          <span>这篇笔记已被外部程序修改。</span>
          <button id="btn-ext-reload" class="mini-btn primary">重新加载</button>
          <button id="btn-ext-keep" class="mini-btn">保留我的版本</button>
        </div>
      </div>

      <footer id="statusbar">
        <span id="save-state">就绪</span>
        <span id="word-count"></span>
      </footer>
    </main>

    <!-- ===================== 右侧面板 ===================== -->
    <aside id="rightbar">
      <div class="rb-tabs">
        <button class="rb-tab active" data-tab="outline">大纲</button>
        <button class="rb-tab" data-tab="backlinks">反向链接</button>
        <button class="rb-tab" data-tab="tasks">任务</button>
      </div>
      <div id="rb-outline" class="rb-view"></div>
      <div id="rb-backlinks" class="rb-view" hidden></div>
      <div id="rb-tasks" class="rb-view" hidden></div>
    </aside>
  </div>

  <!-- ===================== 命令面板 ===================== -->
  <div id="palette-overlay" hidden>
    <div id="palette">
      <div class="palette-input-row">
        <svg viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M11.74 10.34a1 1 0 0 0-1.4 0 1 1 0 0 0 0 1.4l2.46 2.46a1 1 0 0 0 1.4-1.4zM6.5 11a4.5 4.5 0 1 1 4.5-4.5 4.5 4.5 0 0 1-4.5 4.5m0-11a6.5 6.5 0 1 0 6.5 6.5A6.5 6.5 0 0 0 6.5 0"/></svg>
        <input id="palette-input" type="text" placeholder="搜索笔记、输入命令，或 #标签 / >日期 …" autocomplete="off" />
      </div>
      <div id="palette-results"></div>
      <div class="palette-foot">
        <span><kbd>↑↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span>
      </div>
    </div>
  </div>

  <!-- ===================== 通用弹窗 ===================== -->
  <div id="modal-overlay" hidden>
    <div id="modal">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <div id="modal-btns"></div>
    </div>
  </div>

  <!-- ===================== 右键菜单 ===================== -->
  <div id="ctx-menu" hidden></div>

  <!-- ===================== 首次使用引导 ===================== -->
  <div id="onboarding" hidden>
    <div class="onb-card">
      <div class="onb-logo">N</div>
      <h1>NotePlan for Windows</h1>
      <p class="onb-sub">每日笔记 · Markdown · 任务 · 双向链接<br/>你的笔记是磁盘上的纯文本文件，永远属于你。</p>
      <div class="onb-actions">
        <button id="onb-create" class="big-btn primary">创建示例笔记库</button>
        <button id="onb-choose" class="big-btn">选择已有文件夹…</button>
      </div>
      <p class="onb-hint">笔记库就是一个普通文件夹，之后可在设置中随时更换或放入同步盘。</p>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script src="js/api-shim-tauri.js"></script>
  <script src="js/api-shim.js"></script>
  <script src="js/cn-holidays.js"></script>
  <script src="js/errtrap.js"></script>
  <script src="js/cm-bundle.js?v=8"></script>
  <script src="js/markdown.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

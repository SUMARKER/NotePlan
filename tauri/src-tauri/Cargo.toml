[package]
name = "noteplan-tauri"
version = "0.5.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"
regex = "1"
notify = "6"
rfd = "0.15"
ureq = "2"
percent-encoding = "2"

[lib]
name = "noteplan_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

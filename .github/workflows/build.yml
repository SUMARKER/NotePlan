name: build

# push 到 main 时构建验证；推送 v* 标签时构建并发布 GitHub Release；
# 也可在 Actions 页面手动触发。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Electron
  electron:
    name: Electron 打包（方案 A）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: 安装依赖
        working-directory: electron
        run: npm ci

      - name: 构建 CodeMirror bundle
        working-directory: electron
        run: npm run build

      - name: electron-builder 打包
        working-directory: electron
        run: npm run dist

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: electron-installer
          path: |
            electron/dist/*.exe
            electron/dist/*.blockmap
          if-no-files-found: error

  # ------------------------------------------------------------------- Tauri
  tauri:
    name: Tauri 打包（方案 C）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: 安装 tauri-cli
        run: npm install -g '@tauri-apps/cli@^2'

      - name: tauri build
        working-directory: tauri/src-tauri
        run: tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- WebView2
  # 方案 B（WebView2 + .NET）已停止更新：不再参与 CI 打包与前端同步，
  # 代码冻结保留在 webview2/ 目录仅供参考，构建方法见 README。
  # ----------------------------------------------------------------- Release
  # 推送 v* 标签时，把安装包发布为 GitHub Release
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [electron, tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

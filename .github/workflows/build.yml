name: build

# push 到 main 时构建验证；推送 v* 标签时构建并发布 GitHub Release；
# 也可在 Actions 页面手动触发。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Electron
  electron:
    name: Electron 打包（方案 A）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: 安装依赖
        working-directory: electron
        run: npm ci

      - name: 构建 CodeMirror bundle
        working-directory: electron
        run: npm run build

      - name: electron-builder 打包
        working-directory: electron
        run: npm run dist

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: electron-installer
          path: |
            electron/dist/*.exe
            electron/dist/*.blockmap
          if-no-files-found: error

  # ------------------------------------------------------------------- Tauri
  tauri:
    name: Tauri 打包（方案 C）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: 安装 tauri-cli
        run: npm install -g '@tauri-apps/cli@^2'

      - name: tauri build
        working-directory: tauri/src-tauri
        run: tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- WebView2
  webview2:
    name: WebView2 打包（方案 B）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 发布自包含单文件
        working-directory: webview2
        run: >
          dotnet publish NotePlanWpf.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish-selfcontained

      - name: 压缩免安装版
        working-directory: webview2
        run: Compress-Archive -Path 'publish-selfcontained/*' -DestinationPath 'NotePlan-Windows-webview2-portable.zip' -Force

      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 生成安装包
        working-directory: webview2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $makensis = (Get-ChildItem 'C:\Program Files*\NSIS\makensis.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $makensis) { Write-Error 'makensis.exe 未找到（NSIS 安装失败？）'; exit 1 }
          & $makensis setup.nsi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: webview2-installer
          path: |
            webview2/dist/*.exe
            webview2/NotePlan-Windows-webview2-portable.zip
          if-no-files-found: error

  # ----------------------------------------------------------------- Release
  # 推送 v* 标签时，把三个安装包发布为 GitHub Release
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [electron, tauri, webview2]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
